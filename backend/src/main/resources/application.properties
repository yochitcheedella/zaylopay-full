
# ==================================================
# ZAYLOPE - APPLICATION CONFIGURATION
# ==================================================

spring.application.name=zaylope-backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================================================
# ERROR RESPONSE SECURITY
# ==================================================

server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==================================================
# MYSQL DATABASE CONFIGURATION
# ==================================================

# Local development database: zaylope
# Production must supply DB_URL with secure TLS settings.

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/zaylope?allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# HIKARICP CONNECTION POOL
# ==================================================

spring.datasource.hikari.pool-name=ZayloPeConnectionPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=10000


# ==================================================
# FLYWAY DATABASE MIGRATIONS
# ==================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ==================================================
# JPA / HIBERNATE CONFIGURATION
# ==================================================

# Existing database schema is managed separately.
# Never use create or create-drop against existing data.

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# FLYWAY DATABASE MIGRATION
# ==================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=9
spring.flyway.locations=classpath:db/migration

# ==================================================
# BANK DETAILS ENCRYPTION (AES-256-GCM)
# ==================================================

app.bank.encryption-key=${BANK_ENCRYPTION_KEY}

# ==================================================
# CORS CONFIGURATION
# ==================================================

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ==================================================
# EMAIL - SMTP CONFIGURATION
# ==================================================

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==================================================
# APPLICANT VERIFICATION - FEATURE FLAGS
# ==================================================

app.verification.mobile-enabled=${MOBILE_OTP_ENABLED:false}
app.verification.email-enabled=${EMAIL_OTP_ENABLED:false}

# Mock delivery must remain disabled in production.
app.verification.mock-delivery=${OTP_MOCK_DELIVERY:false}

app.verification.otp-hash-key=${OTP_HASH_KEY:}
app.verification.email-from=${SMTP_FROM:}

# ==================================================
# OTP LIFECYCLE
# ==================================================

app.verification.otp-lifetime=PT5M
app.verification.resend-cooldown=PT1M
app.verification.send-window=PT1H

# ==================================================
# OTP SECURITY AND RATE LIMITING
# ==================================================

app.verification.max-sends-per-window=5
app.verification.max-attempts=5
app.verification.max-cumulative-attempts=15

# Persistent per-applicant, destination and client-IP limits

app.verification.max-ip-sends=20
app.verification.max-ip-attempts=100

# ==================================================
# APPLICANT SESSION CONFIGURATION
# ==================================================

applicant.session.cookie-name=ZAYLOPE_APPLICANT
applicant.session.lifetime=30m
applicant.session.secure-cookie=${SESSION_SECURE_COOKIE:false}
applicant.session.onboarding-cookie-name=ZAYLOPE_ONBOARDING
applicant.session.onboarding-lifetime=${APPLICANT_ONBOARDING_LIFETIME:15m}

# Pending contact reservation expiration for unverified drafts
app.registration.pending-reservation-ttl=${PENDING_RESERVATION_TTL:PT30M}

# Set to true in HTTPS production environments.
applicant.session.secure-cookie=${APPLICANT_SESSION_SECURE_COOKIE:false}

# ==================================================
# MULTIPART FILE UPLOAD
# ==================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==================================================
# PRIVATE APPLICANT DOCUMENTS
# ==================================================

app.documents.enabled=${DOCUMENT_UPLOADS_ENABLED:false}
app.documents.storage-directory=${DOCUMENT_STORAGE_DIRECTORY:}

app.documents.required-types=${DOCUMENT_REQUIRED_TYPES:}
app.documents.optional-types=${DOCUMENT_OPTIONAL_TYPES:}

app.documents.collection-purpose=${DOCUMENT_COLLECTION_PURPOSE:}
app.documents.privacy-notice=${DOCUMENT_PRIVACY_NOTICE:}
app.documents.authorized-personnel=${DOCUMENT_AUTHORIZED_PERSONNEL:}

app.documents.retention-policy=${DOCUMENT_RETENTION_POLICY:}
app.documents.retention-period=${DOCUMENT_RETENTION_PERIOD:}
app.documents.deletion-policy=${DOCUMENT_DELETION_POLICY:}
app.documents.privacy-notice-version=${DOCUMENT_PRIVACY_NOTICE_VERSION:}

app.documents.retention-cron=${DOCUMENT_RETENTION_CRON:0 31 2 * * *}

# ==================================================
# SPRING BOOT ACTUATOR
# ==================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

management.health.db.enabled=true

# Enable mail health monitoring when SMTP is configured.
management.health.mail.enabled=${SMTP_HEALTH_ENABLED:false}

# ==================================================
# APPLICATION LOGGING
# ==================================================

logging.level.root=INFO
logging.level.com.zaylope=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.zaxxer.hikari=INFO

# ==================================================
# RAZORPAY PAYMENT CONFIGURATION (TEST MODE)
# ==================================================

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.amount-paise=${RAZORPAY_AMOUNT_PAISE:59900}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.mock-gateway=${RAZORPAY_MOCK_GATEWAY:false}
razorpay.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}

# ==================================================
# GOOGLE OAUTH2 / OPENID CONNECT
# ==================================================

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}


# Explicit account disclosure requires management approval before production use.
app.auth.explicit-login-outcomes=${EXPLICIT_LOGIN_OUTCOMES:false}
